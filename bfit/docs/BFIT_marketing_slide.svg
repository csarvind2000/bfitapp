      .body { fill: #dce8f5; font-size: 28px; }
      .small { fill: #a9bbce; font-size: 22px; }
      .label { fill: #e6fbff; font-size: 21px; font-weight: 700; }
      .title { fill: #f8fafc; font-size: 76px; font-weight: 800; }
      .subhead { fill: #dbeafe; font-size: 30px; font-weight: 500; }
      .cardTitle { fill: #ffffff; font-size: 28px; font-weight: 800; }
      .cardText { fill: #c9d7e6; font-size: 21px; }
    </style>
  </defs>

